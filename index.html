<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notation Hackathon — smsmode × Code4Sud</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Mono:wght@700&display=swap');

:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --surface2: #1c1c26;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.15);
  --accent: #e63329;
  --accent2: #4a9db5;
  --text: #f0f0f0;
  --muted: #777;
  --gold: #d4a04a;
  --green: #5cb85c;
}
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', 'Helvetica Neue', sans-serif; min-height: 100vh; }

/* ── HEADER ── */
header {
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 0.875rem 2rem;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.logos { display: flex; align-items: center; gap: 1.25rem; }
.logos img { height: 32px; width: auto; object-fit: contain; }
.logos .sep { width: 1px; height: 24px; background: var(--border2); }
.header-right { display: flex; align-items: center; gap: 12px; }
.juror-badge {
  font-size: 12px; font-family: 'Space Mono', monospace;
  color: var(--accent2);
  background: rgba(74,157,181,0.1);
  border: 1px solid rgba(74,157,181,0.25);
  border-radius: 6px; padding: 4px 10px;
}
.logout-btn {
  font-size: 12px; background: none; border: 1px solid var(--border2);
  color: var(--muted); border-radius: 6px; padding: 4px 10px; cursor: pointer;
  font-family: inherit;
}
.logout-btn:hover { color: var(--accent); border-color: var(--accent); }

/* ── SCREENS ── */
.screen { display: none; }
.screen.active { display: block; }

/* ── LOGIN ── */
#loginScreen {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 2rem;
}
.login-box {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 16px; padding: 2.5rem 2rem; width: 100%; max-width: 400px;
  text-align: center;
}
.login-box h1 { font-family: 'Space Mono', monospace; font-size: 20px; margin-bottom: 6px; }
.login-box p { font-size: 13px; color: var(--muted); margin-bottom: 2rem; }
.juror-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.5rem; }
.juror-btn {
  padding: 14px 10px; border-radius: 10px;
  border: 1px solid var(--border2); background: var(--surface2);
  color: var(--text); font-size: 14px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; font-family: inherit;
}
.juror-btn:hover { border-color: var(--accent2); background: rgba(74,157,181,0.08); }
.juror-btn.admin-btn {
  grid-column: 1 / -1;
  border-color: var(--gold); color: var(--gold);
  background: rgba(212,160,74,0.08);
}
.juror-btn.admin-btn:hover { background: rgba(212,160,74,0.15); }

/* ── JURY APP ── */
#juryScreen { max-width: 700px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
.page-title { font-family: 'Space Mono', monospace; font-size: 20px; margin-bottom: 4px; }
.page-sub { font-size: 13px; color: var(--muted); margin-bottom: 1.5rem; }

/* Team tabs */
.teams-nav {
  display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.5rem;
  padding-bottom: 1rem; border-bottom: 1px solid var(--border);
}
.team-tab {
  padding: 7px 16px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--muted); font-size: 13px; cursor: pointer; transition: all 0.15s;
  position: relative;
}
.team-tab:hover { border-color: var(--border2); color: var(--text); }
.team-tab.active { border-color: var(--accent2); color: var(--text); background: rgba(74,157,181,0.1); }
.team-tab .done-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--green);
  position: absolute; top: 4px; right: 4px;
}

/* Criteria */
.criteria { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.5rem; }
.criterion {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 1rem 1.25rem; transition: border-color 0.15s;
}
.criterion:hover { border-color: var(--border2); }
.criterion-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.criterion-name { font-size: 15px; font-weight: 500; }
.criterion-badge {
  font-size: 11px; font-family: 'Space Mono', monospace;
  color: var(--accent2); background: rgba(74,157,181,0.12);
  border: 1px solid rgba(74,157,181,0.25); border-radius: 6px; padding: 2px 8px;
}
.criterion-desc { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
.stars-row { display: flex; align-items: center; gap: 8px; }
.stars { display: flex; gap: 6px; }
.star-btn {
  width: 40px; height: 40px; border-radius: 8px;
  border: 1px solid var(--border2); background: var(--surface2);
  color: var(--muted); font-size: 20px; cursor: pointer;
  transition: all 0.12s; display: flex; align-items: center; justify-content: center;
}
.star-btn:hover { border-color: var(--gold); color: var(--gold); }
.star-btn.active { background: rgba(212,160,74,0.15); border-color: var(--gold); color: var(--gold); }
.star-label { margin-left: auto; font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); }
.star-label strong { color: var(--text); font-size: 14px; }

/* Team result */
.team-result {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 14px; padding: 1.25rem 1.5rem;
  display: flex; justify-content: space-between; align-items: center;
}
.result-score { font-family: 'Space Mono', monospace; font-size: 40px; font-weight: 700; line-height: 1; }
.result-score span { font-size: 16px; color: var(--muted); font-weight: 400; }
.result-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.result-pill {
  font-size: 13px; font-weight: 600; padding: 8px 18px; border-radius: 99px;
}
.saved-notice {
  font-size: 12px; color: var(--green); margin-top: 8px;
  display: flex; align-items: center; gap: 6px;
}

/* Progress bar */
.progress-bar {
  height: 3px; background: var(--border); border-radius: 99px;
  margin-bottom: 1.5rem; overflow: hidden;
}
.progress-fill { height: 100%; background: var(--accent2); border-radius: 99px; transition: width 0.3s; }

/* ── ADMIN ── */
#adminScreen { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
.admin-title { font-family: 'Space Mono', monospace; font-size: 20px; margin-bottom: 4px; }
.admin-sub { font-size: 13px; color: var(--muted); margin-bottom: 2rem; }

.admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-bottom: 2rem; }
.team-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 1.25rem; transition: border-color 0.2s;
}
.team-card:hover { border-color: var(--border2); }
.team-card-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.team-card-name { font-size: 15px; font-weight: 600; }
.team-avg {
  font-family: 'Space Mono', monospace; font-size: 22px; font-weight: 700;
}
.team-avg-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
.juror-scores { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
.juror-score-row {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; padding: 3px 0;
}
.juror-score-name { color: var(--muted); }
.juror-score-val { font-family: 'Space Mono', monospace; font-size: 12px; }
.juror-score-val.pending { color: var(--border2); }

/* Podium */
.podium-section { margin-top: 2rem; }
.podium-title {
  font-family: 'Space Mono', monospace; font-size: 12px;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); margin-bottom: 1rem;
}
.podium-row {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.podium-row:last-child { border-bottom: none; }
.podium-rank { width: 28px; text-align: center; font-size: 18px; flex-shrink: 0; }
.podium-name { flex: 1; font-weight: 500; }
.podium-score { font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; }
.podium-bar-wrap { width: 120px; height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
.podium-bar { height: 100%; border-radius: 99px; background: var(--accent2); }

/* Completion badges */
.completion-badge {
  font-size: 11px; padding: 2px 8px; border-radius: 99px;
  font-family: 'Space Mono', monospace;
}
.comp-full { background: rgba(92,184,92,0.15); color: var(--green); border: 1px solid rgba(92,184,92,0.3); }
.comp-partial { background: rgba(212,160,74,0.15); color: var(--gold); border: 1px solid rgba(212,160,74,0.3); }
.comp-none { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }

/* Live indicator */
.live-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--green);
  display: inline-block; margin-right: 6px;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
}

/* Util */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
</style>

<script>
// ✅ Configuration Firebase — hackathon-smsmode
const firebaseConfig = {
  apiKey:            "AIzaSyAgBKe6qb9gQZ2cSEyAcTd7nOAAg54YMNU",
  authDomain:        "hackathon-smsmode.firebaseapp.com",
  databaseURL:       "https://hackathon-smsmode-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "hackathon-smsmode",
  storageBucket:     "hackathon-smsmode.firebasestorage.app",
  messagingSenderId: "975917291369",
  appId:             "1:975917291369:web:b2d38137b8edf477234ff8",
  measurementId:     "G-NX21418SE5"
};


firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const JURORS = ['Ludovic', 'Laurent', 'Guillaume', 'Samir', 'Adrien'];
const TEAMS  = ['Équipe 1','Équipe 2','Équipe 3','Équipe 4','Équipe 5','Équipe 6','Équipe 7','Équipe 8'];
const CRITERIA = [
  { key: 'poc',   name: 'Fonctionnalité du POC',       weight: 0.30, desc: 'Le scénario de bout en bout fonctionne-t-il ?' },
  { key: 'tech',  name: 'Qualité technique',            weight: 0.20, desc: "Code lisible, architecture cohérente, gestion des cas d'erreur" },
  { key: 'value', name: 'Valeur métier',                weight: 0.20, desc: "Est-ce que ça répond à un vrai besoin ? Serait-on prêt à l'intégrer ?" },
  { key: 'pitch', name: 'Qualité du pitch',             weight: 0.20, desc: 'Clarté, structure, capacité à convaincre un interlocuteur non-tech' },
  { key: 'reuse', name: 'Potentiel de réutilisabilité', weight: 0.10, desc: 'README, documentation, facilité à reprendre le projet' },
];

let currentUser = null;
let activeTeam  = TEAMS[0];
let allScores   = {};  // allScores[juror][team][criterionKey] = 0-4

// ── AUTH ──
function login(name) {
  currentUser = name;
  document.getElementById('loginScreen').classList.remove('active');
  const headerRight = document.getElementById('headerRight');

  if (name === 'ADMIN') {
    headerRight.innerHTML = `<span class="juror-badge">★ Admin</span><button class="logout-btn" onclick="logout()">Déconnexion</button>`;
    document.getElementById('adminScreen').classList.add('active');
    startAdminListener();
  } else {
    headerRight.innerHTML = `<span class="juror-badge">${name}</span><button class="logout-btn" onclick="logout()">Déconnexion</button>`;
    document.getElementById('juryScreen').classList.add('active');
    document.getElementById('jurySubtitle').textContent = `Bonjour ${name} — note chaque équipe sur 4 par critère`;
    startJuryListener(name);
    renderTeamsNav();
    renderCriteria();
  }
}

function logout() {
  currentUser = null;
  activeTeam = TEAMS[0];
  ['loginScreen','juryScreen','adminScreen'].forEach(id => {
    document.getElementById(id).classList.remove('active');
  });
  document.getElementById('loginScreen').classList.add('active');
  document.getElementById('headerRight').innerHTML = '';
}

// ── FIREBASE LISTENERS ──
function startJuryListener(juror) {
  db.ref(`scores/${juror}`).on('value', snap => {
    allScores[juror] = snap.val() || {};
    renderTeamsNav();
    renderCriteria();
    renderTeamResult();
    updateProgress();
  });
}

function startAdminListener() {
  db.ref('scores').on('value', snap => {
    allScores = snap.val() || {};
    renderAdmin();
  });
}

// ── JURY: write score ──
function setScore(team, key, val) {
  const juror = currentUser;
  const current = (allScores[juror]?.[team]?.[key]) || 0;
  const newVal = (current === val) ? 0 : val;
  db.ref(`scores/${juror}/${team}/${key}`).set(newVal);
}

// ── JURY: team tabs ──
function renderTeamsNav() {
  const juror = currentUser;
  const nav = document.getElementById('teamsNav');
  nav.innerHTML = TEAMS.map(t => {
    const teamScores = allScores[juror]?.[t] || {};
    const done = CRITERIA.every(c => (teamScores[c.key] || 0) > 0);
    return `
      <div class="team-tab ${t === activeTeam ? 'active' : ''}" onclick="switchTeam('${esc(t)}')">
        ${esc(t)}
        ${done ? '<span class="done-dot" title="Noté"></span>' : ''}
      </div>`;
  }).join('');
}

function switchTeam(name) {
  activeTeam = name;
  renderTeamsNav();
  renderCriteria();
  renderTeamResult();
}

// ── JURY: criteria ──
function renderCriteria() {
  const juror = currentUser;
  const teamScores = allScores[juror]?.[activeTeam] || {};
  const list = document.getElementById('criteriaList');
  list.innerHTML = CRITERIA.map(c => {
    const val = teamScores[c.key] || 0;
    const contrib = (val * c.weight * 5).toFixed(2);
    const stars = [1,2,3,4].map(n => `
      <button class="star-btn ${val >= n ? 'active' : ''}"
        onclick="setScore('${esc(activeTeam)}','${c.key}',${n})">
        ${val >= n ? '★' : '☆'}
      </button>`).join('');
    return `
      <div class="criterion">
        <div class="criterion-head">
          <span class="criterion-name">${c.name}</span>
          <span class="criterion-badge">${Math.round(c.weight*100)}%</span>
        </div>
        <div class="criterion-desc">${c.desc}</div>
        <div class="stars-row">
          <div class="stars">${stars}</div>
          <span class="star-label"><strong>${val}</strong>/4 → <strong>${contrib}</strong> pts</span>
        </div>
      </div>`;
  }).join('');
}

function renderTeamResult() {
  const juror = currentUser;
  const teamScores = allScores[juror]?.[activeTeam] || {};
  let total = 0;
  CRITERIA.forEach(c => { total += (teamScores[c.key] || 0) * c.weight; });
  const score = total * 5;
  const badge = getBadge(score);
  const allDone = CRITERIA.every(c => (teamScores[c.key] || 0) > 0);
  document.getElementById('teamResult').innerHTML = `
    <div>
      <div class="result-label">${esc(activeTeam)} — ta note</div>
      <div class="result-score" style="color:${badge.color}">${score.toFixed(2)}<span> / 20</span></div>
      ${allDone ? '<div class="saved-notice">✓ Sauvegardé automatiquement</div>' : '<div style="font-size:12px;color:var(--muted);margin-top:6px;">Note tous les critères pour valider</div>'}
    </div>
    <span class="result-pill" style="background:${badge.bg};color:${badge.color};border:1px solid ${badge.border}">${badge.text}</span>`;
}

function updateProgress() {
  const juror = currentUser;
  let done = 0;
  TEAMS.forEach(t => {
    if (CRITERIA.every(c => (allScores[juror]?.[t]?.[c.key] || 0) > 0)) done++;
  });
  document.getElementById('progressFill').style.width = `${Math.round(done / TEAMS.length * 100)}%`;
}

// ── ADMIN ──
function calcTeamAvg(team) {
  let sum = 0, count = 0;
  JURORS.forEach(j => {
    const ts = allScores[j]?.[team];
    if (!ts) return;
    const allFilled = CRITERIA.every(c => (ts[c.key] || 0) > 0);
    if (!allFilled) return;
    let s = 0;
    CRITERIA.forEach(c => { s += (ts[c.key] || 0) * c.weight; });
    sum += s * 5; count++;
  });
  return count > 0 ? { avg: sum / count, count } : { avg: null, count: 0 };
}

function jurorScoreForTeam(juror, team) {
  const ts = allScores[juror]?.[team];
  if (!ts) return null;
  const allFilled = CRITERIA.every(c => (ts[c.key] || 0) > 0);
  if (!allFilled) return null;
  let s = 0;
  CRITERIA.forEach(c => { s += (ts[c.key] || 0) * c.weight; });
  return s * 5;
}

function renderAdmin() {
  const grid = document.getElementById('adminGrid');
  const podium = document.getElementById('podiumList');

  const teamData = TEAMS.map(t => {
    const { avg, count } = calcTeamAvg(t);
    return { name: t, avg, count };
  });

  grid.innerHTML = TEAMS.map(t => {
    const { avg, count } = calcTeamAvg(t);
    const color = avg !== null ? getBadge(avg).color : 'var(--muted)';
    const completionClass = count === JURORS.length ? 'comp-full' : count > 0 ? 'comp-partial' : 'comp-none';
    const completionText = count === JURORS.length ? `${JURORS.length}/${JURORS.length} jurés` : count > 0 ? `${count}/${JURORS.length} jurés` : 'En attente';
    const jurorRows = JURORS.map(j => {
      const s = jurorScoreForTeam(j, t);
      return `<div class="juror-score-row">
        <span class="juror-score-name">${j}</span>
        <span class="juror-score-val ${s === null ? 'pending' : ''}">${s !== null ? s.toFixed(2) : '–'}</span>
      </div>`;
    }).join('');
    return `
      <div class="team-card">
        <div class="team-card-header">
          <span class="team-card-name">${esc(t)}</span>
          <span class="completion-badge ${completionClass}">${completionText}</span>
        </div>
        <div class="team-avg" style="color:${color}">${avg !== null ? avg.toFixed(2) : '—'}<span style="font-size:14px;color:var(--muted);font-family:'DM Sans',sans-serif;font-weight:400"> / 20</span></div>
        <div class="team-avg-label">Moyenne jury ${avg !== null ? `(${count} note${count>1?'s':''})` : '(aucune note complète)'}</div>
        <div class="juror-scores">${jurorRows}</div>
      </div>`;
  }).join('');

  const sorted = [...teamData].filter(t => t.avg !== null).sort((a,b) => b.avg - a.avg);
  const medals = ['🥇','🥈','🥉'];
  const maxAvg = sorted[0]?.avg || 1;
  podium.innerHTML = sorted.map((t, i) => `
    <div class="podium-row">
      <span class="podium-rank">${medals[i] || (i+1)}</span>
      <span class="podium-name">${esc(t.name)}</span>
      <div class="podium-bar-wrap"><div class="podium-bar" style="width:${Math.round(t.avg/maxAvg*100)}%"></div></div>
      <span class="podium-score" style="color:${getBadge(t.avg).color}">${t.avg.toFixed(2)}</span>
    </div>`).join('');

  if (sorted.length === 0) {
    podium.innerHTML = '<p style="color:var(--muted);font-size:13px;">En attente des premières notes complètes…</p>';
  }
}

// ── UTILS ──
function getBadge(score) {
  if (score >= 18) return { text: 'Excellent ✦', bg: 'rgba(92,184,92,0.15)',   color: '#5cb85c', border: 'rgba(92,184,92,0.3)' };
  if (score >= 15) return { text: 'Très bien',   bg: 'rgba(74,157,181,0.15)',  color: '#4a9db5', border: 'rgba(74,157,181,0.3)' };
  if (score >= 12) return { text: 'Bien',        bg: 'rgba(130,90,220,0.15)',  color: '#a07fd4', border: 'rgba(130,90,220,0.3)' };
  if (score >= 8)  return { text: 'Moyen',       bg: 'rgba(212,160,74,0.15)', color: '#d4a04a', border: 'rgba(212,160,74,0.3)' };
  return                  { text: 'À améliorer', bg: 'rgba(230,51,41,0.15)',  color: '#e63329', border: 'rgba(230,51,41,0.3)' };
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
